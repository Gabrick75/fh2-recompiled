# ============================================================================
#  Forza Horizon 2 (Xbox 360, USA) - manual declarations for the codegen
#
#  Included from fh2_manifest.toml via includes = ["overrides.toml"].
#  Included files use the flat schema (sections at the root).
#
#  Valid address range of default.xex: 0x82000000 - 0x83700000
#  (image base 0x82000000 + 24,117,248 bytes of image)
#
#  Each entry was checked against a disassembly of the loaded image
#  (REXGLUE_DUMP_IMAGE=<folder> rexglue codegen ...).
# ============================================================================

# The C runtime's setjmp (saves f14-f31, r13-r31 and v64-v127 at 0/152/320 of the buffer) and longjmp (restores the
# same layout, r3 = buffer, r4 = value). The image decoders of the paint shop and other screens (9 setjmp call sites,
# 8 longjmp) recover from errors with them; recompiled as plain functions, a longjmp could not return to its setjmp and
# the decoder went on with a null context: the crash on entering the paint shop (sub_82B9FBD0 reading 0x1A4, called
# after the setjmp in sub_82B89DA0). With these the codegen emits ppc_setjmp / ppc_longjmp (host setjmp keyed by the
# guest buffer, with the PPCContext saved and restored).
setjmp_address = 0x82C055F0
longjmp_address = 0x82C050C0

# Registers as C++ local variables instead of fields of ctx, as nfsmw-android does (its docs/toolchain.md): the
# compiler keeps them in the host's registers. These keys must stay above [functions]: below it TOML would put them
# in that table and the codegen would ignore them without a word.
#   cr_as_local            the condition register (every compare and branch)
#   xer_as_local           carry/overflow (every compare reads it)
#   ctr_as_local           the count register
#   non_volatile_as_local  r14-r31, f14-f31 and v14-v31/v64-v127: no more __savegprlr_N / __restgprlr_N calls, which
#                          were ~5 % of every game thread on the Moto G9 Play (app/out/perfil_20261022_114345)
# Our hooks read none of their caller's registers but lr (skip_lr stays off). Pieces of a function that read a
# register their parent set (tools/lee_antes.py) are marked with share_registers in [functions].
# non_argument_as_local stays off: it would make r12 local, and __savevmx_N takes r12 as its base.
# setjmp/longjmp (the image decoders' error paths) restore ctx but not the locals.
cr_as_local = true
xer_as_local = true
ctr_as_local = true
non_volatile_as_local = true

[functions]

