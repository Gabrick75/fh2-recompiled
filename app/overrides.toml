# ============================================================================
#  Forza Horizon 2 (Xbox 360, USA) - manual declarations for the codegen
#
#  Included from fh2_manifest.toml via includes = ["overrides.toml"].
#  Included files use the flat schema (sections at the root).
#
#  Valid address range of default.xex: 0x82000000 - 0x83700000
#  (image base 0x82000000 + 24,117,248 bytes of image)
#
#  Each entry was checked against a disassembly of the loaded image
#  (REXGLUE_DUMP_IMAGE=<folder> rexglue codegen ...).
# ============================================================================

[functions]

# --- Validate: "target not in any function" (first codegen, 10 errors) -------

# Leaf functions without a prologue (no mflr / stwu), right after the tail of the previous function,
# so discovery did not see them start. Each one ends with a "b" back into its own "li r3, 0; blr".
"0x8305E798" = { size = 0x88 }
"0x8305E8B0" = { size = 0x88 }
"0x83045378" = { size = 0x90 }

# Adjustor thunk (multiple inheritance): addi r3, r3, 0x6C; b 0x82E839F8.
# Reached from the thunk at 0x82E78AF8 (addi r3, r3, -0x7C; b here).
"0x82E83A70" = { size = 0x8 }

# Table of small accessor thunks reached by tail calls ("lis r11; lwz r3; b") from 0x82C97898-0x82C97990.
"0x82C9EFD8" = { size = 0x10 }  # lis/ori r11 = 0x17164; lwzx r3, r3, r11; blr
"0x82C9EFF0" = { size = 0x8 }   # addi r3, r3, 0x110; b ...
"0x82C9EFF8" = { size = 0x8 }
"0x82C9F000" = { size = 0x8 }
"0x82C9F008" = { size = 0x8 }
"0x82C9F010" = { size = 0xC }   # addis/addi r3 += 0x17190; blr

# Second level of the same accessors: "lwz r3, 0(r3); b ..." thunks and one leaf setter,
# reached from the 0x82C9EFxx thunks above.
"0x82CBFCB8" = { size = 0x8 }
"0x82CBFCC0" = { size = 0x8 }
"0x82CBFCC8" = { size = 0x8 }
"0x82CBFCD0" = { size = 0x14 }  # slwi/add/stfs/stw; blr

# ----------------------------------------------------------------------------
#  NATIVE XAPI / CRT FUNCTIONS
#
#  Each game function at these addresses is replaced by the SDK's native one
#  (sdk/src/kernel/crt). Identified by reading the disassembly.
# ----------------------------------------------------------------------------
[rexcrt]

# XAPI fibers (block 0x831D5D28-0x831D5F5C). The guest SwitchToFiber is a "b" into a hand-written
# context switch at 0x831D75A0 (saves r14-r31, f14-f31, v64-v127, CR, LR into the fiber, mfcr/stvx128)
# that a recompiled program cannot run, so all five go native. Their fiber layout matches the SDK's
# X_FIBER_CONTEXT: 0xA50 bytes, lpParameter at +0, stack fields at +4/+8/+0xC copied from KTHREAD
# +0xD0/+0x5C/+0x60, and the current fiber in KTHREAD+0x164. GetCurrentFiber (0x831D5D28) and
# GetFiberData only read those fields, so they stay recompiled.
ConvertThreadToFiber = 0x831D5D38  # fiber_ptr must be 0; allocates 0xA50 bytes
ConvertFiberToThread = 0x831D5DC8  # clears fiber_ptr and frees it
CreateFiber = 0x831D5E18           # (stack size, start address, parameter); initial LR 0x831D7590
DeleteFiber = 0x831D5EF8           # self-delete ends the thread (0x831D5090)
SwitchToFiber = 0x831D5F58         # b 0x831D75A0
