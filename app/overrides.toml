# --- Validate: "target not in any function" (first codegen, 10 errors) -------

# Leaf functions without a prologue (no mflr / stwu), right after the tail of the previous function,
# so discovery did not see them start. Each one ends with a "b" back into its own "li r3, 0; blr".
